<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>高绩效团队评估</title>

  <!-- ✅ 正确加载 Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ✅ 正确加载 Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: "Microsoft YaHei", Arial;
      background: #f5f7fa;
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }
    h1, h2 { text-align: center; }
    .question {
      background: #fff;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 8px;
    }
    .score {
      display: flex;
      align-items: center;
      margin-top: 8px;
    }
    input[type=range] { flex: 1; }
    .score-value {
      width: 40px;
      text-align: center;
      font-weight: bold;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #1677ff;
      color: #fff;
    }
  </style>
</head>

<body>

<h1>高绩效团队评估</h1>

<div id="questions"></div>

<button onclick="submitScores()">提交评分</button>

<script>
  /* ===== Supabase 配置 ===== */
  const SUPABASE_URL = "https://eoemidfxwkwapuncnsye.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Jy-XR8__rnOz9mDf7mr6PA_csMj7ehK";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  /* ===== 评分项 ===== */
  const questions = [
    "团队成员感到被重视",
    "成为团队一员充满乐趣",
    "团队充分发挥员工的最高水平和最佳才能",
    "团队努力保留优秀人才",
    "员工理解自己的工作如何匹配团队目标",
    "团队领导者以身作则推动高绩效",
    "业务状态的重要信息与所有人共享",
    "团队持续寻找提升工作效率的方法",
    "工作团队内部信息自由交换",
    "团队将问题转化为机遇",
    "持续寻求新想法",
    "学习行为受到奖励",
    "团队快速适应环境变化",
    "新想法得到尝试落地",
    "错误被视为学习的机会"
  ];

  const container = document.getElementById("questions");

  questions.forEach((q, i) => {
    const div = document.createElement("div");
    div.className = "question";
    div.innerHTML = `
      <b>${i + 1}. ${q}</b>
      <div class="score">
        <input type="range" min="0" max="10" value="5" id="q${i}">
        <div class="score-value" id="v${i}">5</div>
      </div>
    `;
    container.appendChild(div);

    const slider = div.querySelector("input");
    const value = div.querySelector(".score-value");
    slider.oninput = () => value.innerText = slider.value;
  });

  console.log("✅ 已成功渲染 15 个评分项");

  async function submitScores() {
    const scores = [];
    for (let i = 0; i < questions.length; i++) {
      scores.push(Number(document.getElementById("q" + i).value));
    }

    const { error } = await supabaseClient
      .from("scores")
      .insert([{ scores }]);

    if (error) {
      alert("❌ 提交失败");
    } else {
      alert("✅ 提交成功");
    }
  }
</script>

</body>
</html>
